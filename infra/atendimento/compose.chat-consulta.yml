name: grazing-donatella-chat-consulta-v2
services:
  chat:
    image: ${DONATELLA_CHAT_CONSULTA_IMAGEM:?imagem isolada validada}
    container_name: grazing-donatella-chat-consulta-v2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    volumes:
      # Apenas código: dados, arquivos e autorização permanecem no leitor existente.
      - ${DONATELLA_CHAT_CONSULTA_RELEASE:?release isolada}:/chat-consulta:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    networks: [proxy]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/consulta/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging: {driver: json-file, options: {max-size: 5m, max-file: "2"}}
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.donatella-chat-consulta-http.rule=Host(`atendimento.grazinghub.com.br`) && (Path(`/consulta`) || PathPrefix(`/consulta/`))
      - traefik.http.routers.donatella-chat-consulta-http.entrypoints=web
      - traefik.http.routers.donatella-chat-consulta-http.middlewares=redirect-to-https@file
      - traefik.http.routers.donatella-chat-consulta-http.service=donatella-chat-consulta-v2
      - traefik.http.routers.donatella-chat-consulta-http.priority=100
      - traefik.http.routers.donatella-chat-consulta-https.rule=Host(`atendimento.grazinghub.com.br`) && (Path(`/consulta`) || PathPrefix(`/consulta/`))
      - traefik.http.routers.donatella-chat-consulta-https.entrypoints=websecure
      - traefik.http.routers.donatella-chat-consulta-https.tls.certresolver=letsencrypt
      - traefik.http.routers.donatella-chat-consulta-https.service=donatella-chat-consulta-v2
      - traefik.http.routers.donatella-chat-consulta-https.priority=100
      - traefik.http.services.donatella-chat-consulta-v2.loadbalancer.server.port=3000
networks:
  proxy:
    external: true
    name: dokploy-network
